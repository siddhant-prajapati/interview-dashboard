server:
  port: 8081
spring:
  application:
    name: interview-dashboard

  datasource:
    url: jdbc:mysql://localhost:3306/interview_dashboard_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # jpa must be at the same indentation level as datasource
  jpa:
    hibernate:
      # Use 'update' to keep existing data, or 'create' to wipe and rebuild tables on startup
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

    open-in-view: false

openrouter:
  api-url: https://openrouter.ai/api/v1/chat/completions
  api-key: ${OPENROUTER_API_KEY:your_default_key_here}
  model: ${OPENROUTER_MODEL:openrouter/free}